<!DOCTYPE html>
<!-- 分享圖 docs/og.png 與 docs/og-en.png 的版型：複製到 docs/ 開本機伺服器，瀏覽器視窗設 1200×630，開 ?lang=zh 與 ?lang=en 各截一張 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0a0b0d}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC",sans-serif;color:#f2f3f5;position:relative}
  .glow{position:absolute;inset:0;background:radial-gradient(700px 420px at 18% 30%,rgba(69,200,172,.24),transparent 70%),radial-gradient(600px 500px at 95% 110%,rgba(69,200,172,.12),transparent 70%)}
  .left{position:absolute;left:72px;top:0;bottom:0;width:590px;display:flex;flex-direction:column;justify-content:center;gap:26px}
  .brand{display:flex;align-items:center;gap:20px}
  .brand img{width:96px;height:96px;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .brand b{font-size:58px;letter-spacing:-1.5px}
  h1{font-size:44px;line-height:1.22;letter-spacing:-.8px;font-weight:700}
  h1 span{color:#45c8ac}
  p{font-size:24px;line-height:1.55;color:#c3c6ce}
  kbd{display:inline-block;font:600 21px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-bottom-width:3px;border-radius:8px;padding:6px 11px;color:#fff;vertical-align:2px}
  .meta{font-size:19px;color:#8d919a;display:flex;gap:14px;align-items:center}
  .meta i{width:5px;height:5px;border-radius:50%;background:#555a63;display:block}
  .shot{position:absolute;right:-70px;top:70px;width:560px}
</style>
</head>
<body>
<div class="glow"></div>
<div class="left">
  <div class="brand"><img src="/icon.png?v=configgy" alt=""><b>Configgy</b></div>
  <h1 id="h1"></h1>
  <p id="p"></p>
  <div class="meta" id="meta"></div>
</div>
<img class="shot" id="shot" alt="">
<script>
const zh=new URLSearchParams(location.search).get("lang")!=="en";
document.documentElement.lang=zh?"zh-Hant":"en";
h1.innerHTML=zh?'你的設定檔，<br><span>值得一份回得去的備份</span>':'Your config deserves<br><span>a backup you can walk back</span>';
p.innerHTML=zh?'Zen Browser、Claude Code、任何資料夾，<br>存成可預覽、可回滾的快照，換機一鍵還原。':'Zen Browser, Claude Code, any folder:<br>snapshots you can preview, roll back and restore.';
meta.innerHTML=(zh?['macOS 14+','免費開源','不碰密碼與私鑰']:['macOS 14+','Free & open source','No passwords or keys']).join('<i></i>');
shot.src=(zh?"/shots/main-dark.png":"/readme-shots/en-main-dark.png")+"?v=configgy";
</script>
</body>
</html>
